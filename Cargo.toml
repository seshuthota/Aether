[package]
name = "aether-learn"
version = "0.1.0"
edition = "2024"
publish = false
description = "The learning journal's own code: exercises written while studying the engine"

# The engine itself lives in ../aether-infer (its own repository since
# 2026-11-07). Exercises can compare against it: `use aether::…` is the
# engine, with its internals (kernels, bench, membench) opened.
[dependencies]
aether = { path = "../aether-infer/crates/aether", package = "aether-infer", features = ["internals"] }

[profile.release]
debug = true        # keep symbols so simpleperf can show function names
